<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Patterns Asset Heatmap Prototype</title>
  <link rel="stylesheet" href="../styles.css">
  <style>html,body{margin:0;width:100%;height:100%;background:#f4f5f8}*{scrollbar-color:#c7cad4 transparent}</style>
</head>
<body>
  <script src="daily-patterns-prototype-fixture.js"></script>
  <script>
    const fixture = window.__UPA_DAILY_PATTERNS_FIXTURE__, storage = Object.create(null);
    storage[`unityPublisherAnalyticsPrefsV2:${encodeURIComponent(fixture.publisherId)}`] = {
      section: "analytics", view: "calendar", range: "all", interval: "month", theme: "light",
      calendarMetric: "pageViews", calendarStyle: "assets", lifetimeMetric: "revenue", lifetimeStyle: "area",
      lifetimeAlign: "calendar", lifetimeStackDefaultApplied: true, sankeyGroupBy: "category", sankeyCategoryDefaultApplied: true
    };
    const messageListeners = [];
    window.chrome = {
      storage: { local: {
        async get(key) { return typeof key === "string" ? { [key]: storage[key] } : { ...storage }; },
        async set(values) { Object.assign(storage, values); }
      }},
      runtime: {
        getURL(path) { return new URL(`../${path}`, location.href).href; },
        onMessage: { addListener(listener) { messageListeners.push(listener); } },
        async sendMessage(message) {
          if (message.type === "UPA_DB_GET_ALL") return { ok: true, result: fixture.records };
          if (message.type === "UPA_DB_GET_META") return { ok: true, result: null };
          return { ok: true, result: true };
        }
      }
    };
    window.addEventListener("message", event => {
      const message = event.data;
      if (message?.source !== "unity-publisher-analytics" || message?.type !== "UPA_API_REQUEST") return;
      const data = message.path === "/publisher-v2-api/user"
        ? { publisherId: fixture.publisherId, publisherName: fixture.publisherName, publisherOrgId: "atlas-forge" }
        : [];
      window.postMessage({ source: "unity-publisher-analytics-api", type: "UPA_API_RESPONSE", requestId: message.requestId, ok: true, status: 200, data }, location.origin);
    });
    window.__openAnalytics = () => messageListeners.forEach(listener => listener({ type: "UPA_TOGGLE" }));
  </script>
  <script src="../vendor/echarts.min.js"></script>
  <script src="../content.js"></script>
</body>
</html>
